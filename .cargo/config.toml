# Здесь только ПЕРЕНОСИМЫЕ настройки. Всё, что зависит от машины, задают
# сборочные скрипты через RUSTFLAGS (переменная окружения у cargo старше этого
# файла и перебивает его целиком).
#
# Раньше в этом файле стояли `-fuse-ld=mold` и `-C target-cpu=native`, и оба
# были верны ровно для одной машины:
#   * без mold чужой клон не собирался вовсе — линковка падала на
#     «cannot find -fuse-ld=mold», и первое, что видел посторонний, была
#     ошибка сборки. Из-за неё же CI приходится запускать с RUSTFLAGS,
#     перебивающим этот файл;
#   * `target-cpu=native` компилирует под процессор СБОРЩИКА (AVX2/BMI2 без
#     рантайм-проверок). Бинарь, унесённый на другую машину, падает там с
#     SIGILL — а по умолчанию так собиралось всё, включая то, что человек
#     потом кладёт в пакет или несёт на ноутбук.
#
# Кому это нужно, тот получает то же самое явно:
#   ./install.sh --native          собрать под этот процессор
#   PLX_NATIVE=1 ./build.sh        то же самое для авторской сборки
# Линкер (mold, затем lld) скрипты подхватывают сами, если он есть в системе.
[target.x86_64-unknown-linux-gnu]
rustflags = []
