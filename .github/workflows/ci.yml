# Сборка и тесты на чистой машине. Смысл проверки не в том, что код собирается
# у автора, — а в том, что он собирается У ПОСТОРОННЕГО: по списку пакетов из
# README, без /nix/store, без mold и без правок под это железо.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Отладочная информация не нужна: она только раздувает кэш и время сборки.
  # Раньше эта переменная существовала ещё и затем, чтобы ПЕРЕБИТЬ
  # .cargo/config.toml — там лежали `-fuse-ld=mold` и `target-cpu=native`, оба
  # верные для машины автора и неверные для рантайма GitHub. Теперь в том файле
  # нет ничего машинного (линкер подбирают сборочные скрипты), и перебивать
  # нечего. `-D warnings` намеренно НЕ ставим: на рантайме стоит СВОЙ rustc,
  # обычно свежее авторского, и любое новое предупреждение в нём уронило бы
  # сборку, которая на самом деле в порядке. Задача этой проверки — доказать,
  # что дерево собирается у постороннего, а не судить его стиль.
  RUSTFLAGS: -C debuginfo=0

jobs:
  build:
    name: ${{ matrix.bin }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bin: [plx-standard, plx-extra]
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          # libpipewire-0.3 и libspa просят крейты `pipewire` и `libspa` (через
          # них идёт портал демонстрации экрана), pixman — рендерер smithay:
          # он линкуется через -lpixman-1. Ни один из трёх не приезжает
          # зависимостью остальных, и без них сборка падает ещё в build.rs
          # у libspa-sys — на этом CI не проходил ни разу (05.09.2026).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libinput-dev \
            libudev-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libdisplay-info-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libpixman-1-dev

      - uses: dtolnay/rust-toolchain@stable

      # Ключ включает имя бинаря: наборы фич у них разные, и общий каталог
      # сборки они вытесняли бы друг у друга (та же причина, по которой
      # build.sh держит два --target-dir).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.bin }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.bin }}-

      - name: Сборка
        run: cargo build --release -p ${{ matrix.bin }}

  test:
    name: тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          # libpipewire-0.3 и libspa просят крейты `pipewire` и `libspa` (через
          # них идёт портал демонстрации экрана), pixman — рендерер smithay:
          # он линкуется через -lpixman-1. Ни один из трёх не приезжает
          # зависимостью остальных, и без них сборка падает ещё в build.rs
          # у libspa-sys — на этом CI не проходил ни разу (05.09.2026).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libinput-dev \
            libudev-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libdisplay-info-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libpixman-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # Тесты живут в библиотеке и не требуют ни экрана, ни DRM: это геометрия
      # холста, дерево тайлинга, разбор конфигурации и протоколы.
      - name: Тесты
        run: cargo test --features extra

  # ── Скрипты ──────────────────────────────────────────────────────────────
  #
  # Установка у постороннего начинается не с cargo, а с install.sh, и опечатка
  # в нём видна только когда человек уже запустил его у себя. Проверка дешёвая:
  # разбор синтаксиса всеми интерпретаторами, которым эти файлы предназначены,
  # и холостой прогон установки (--dry-run не выполняет ни одной команды).
  scripts:
    name: скрипты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис
        run: |
          for f in install.sh build.sh build_portable.sh launch_native.sh \
                   harness.sh dist/install-deps.sh dist/install-session.sh; do
              bash -n "$f" && echo "ok   $f"
          done
          # parallax-session — это /bin/sh, а не bash: его читает менеджер
          # входа, у которого bash может и не быть вовсе.
          sh -n dist/parallax-session && echo "ok   dist/parallax-session"

      - name: install.sh --dry-run
        run: |
          ./install.sh --help
          ./install.sh --dry-run --both --quick -y
          ./install.sh --dry-run --uninstall

  # ── Сборка «как у постороннего»: git clone, cd, компилятор ────────────────
  #
  # Отличается от job `build` намеренно и по всем трём пунктам:
  #
  #   * дерево берётся `git clone`, а не actions/checkout — то есть ровно тем
  #     способом, каким его берёт человек, прочитавший README. Никаких файлов,
  #     подложенных рантаймом мимо репозитория, тут быть не может;
  #   * зависимости ставит `dist/install-deps.sh`, а не свой список пакетов
  #     внутри workflow. Ради этого job и существует: список в скрипте — то,
  #     чему верит читатель README, и разъехаться с ним он не должен незаметно;
  #   * КЭША НЕТ. Первая сборка тянет smithay из git и сотни крейтов, и вопрос
  #     как раз в том, доедет ли она с нуля.
  #
  # Собирает `build_portable.sh` — оба бинаря, теми же двумя вызовами cargo.
  # Имя job'а латиницей нарочно: GitHub принимает в идентификаторе только
  # [A-Za-z0-9_-], кириллица здесь — синтаксическая ошибка всего файла.
  # Человеку видно `name:`, оно ниже.
  clone:
    name: сборка из чистого клона
    runs-on: ubuntu-24.04
    steps:
      - name: git clone
        run: |
          git clone --no-single-branch \
            https://github.com/${{ github.repository }}.git parallax
          cd parallax
          # Именно тот коммит, из-за которого запустились: у pull_request
          # github.sha — это слитый предпросмотр, его в клоне нет, поэтому
          # для PR берём голову ветки.
          git checkout --detach "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: dtolnay/rust-toolchain@stable

      - name: Зависимости по README
        run: |
          cd parallax
          # Единственная строка, которой нет в README: списки пакетов на
          # рантайме приезжают устаревшими, и без обновления apt берёт версии,
          # которых на зеркале уже нет. На своей машине человек обновляется сам.
          sudo apt-get update
          ./dist/install-deps.sh --print
          sudo ./dist/install-deps.sh

      - name: ./build_portable.sh
        run: |
          cd parallax
          ./build_portable.sh

      # Собралось — но собралось ли то, что запускают. Бинарь должен хотя бы
      # подняться и ответить: динамическая линковка (EGL, GLES, pixman,
      # libspa) проверяется только запуском, `cargo build` о ней не судит.
      - name: Бинарь запускается
        run: |
          cd parallax
          ls -lh target/release/plx-standard target/release/plx-extra
          ./target/release/plx-standard --version
          ./target/release/plx-extra --version
